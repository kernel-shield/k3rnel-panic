<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta | Kernel Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Supabase JS SDK CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="noise-veil"></div>

<header class="topnav">
  <a href="index.html" class="brand">
    <img src="assets/logo.png" alt="Kernel Shield">
    <div class="name">Kernel<span>Shield</span></div>
  </a>
  <nav class="mainlinks" id="publicNav">
    <a href="index.html" data-nav="inicio">Inicio</a>
    <a href="vps.html" data-nav="vps">VPS</a>
    <a href="login.html" data-nav="login">Iniciar Sesión</a>
  </nav>
  <div class="nav-right" id="navRight">
    <div class="badge-status"><span class="dot-live"></span> Todos los sistemas operativos</div>
    <a href="login.html" class="btn btn-ghost btn-sm">Client Area</a>
  </div>
</header>

<main>
  <section class="view active">
    <div class="auth-wrap">
      <div class="auth-card" style="max-width:460px;">
        <div class="auth-head">
          <img src="assets/logo.png" alt="Kernel Shield">
          <h1>Crea tu cuenta</h1>
          <p>Regístrate para ordenar servicios y gestionar tu hosting</p>
        </div>
        <div class="form-msg" id="regMsg"></div>
        <form id="regForm">
          <div class="field-row">
            <div class="field">
              <label>Nombre</label>
              <input type="text" id="regFirst" placeholder="Juan" required>
            </div>
            <div class="field">
              <label>Apellido</label>
              <input type="text" id="regLast" placeholder="Pérez" required>
            </div>
          </div>
          <div class="field">
            <label>Correo electrónico</label>
            <input type="email" id="regEmail" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="field">
            <label>País</label>
            <select id="regCountry">
              <option>Colombia</option>
              <option>México</option>
              <option>Argentina</option>
              <option>Perú</option>
              <option>Chile</option>
              <option>Venezuela</option>
              <option>Ecuador</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Contraseña</label>
              <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="field">
              <label>Confirmar</label>
              <input type="password" id="regPass2" placeholder="Repite la contraseña" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
        </form>

        <div style="display:flex; align-items:center; margin: 18px 0; gap: 10px;">
          <div style="flex:1; height:1px; background:rgba(255,255,255,0.1);"></div>
          <span style="font-size:12px; color:var(--text-2); text-transform:uppercase; letter-spacing:1px;">o</span>
          <div style="flex:1; height:1px; background:rgba(255,255,255,0.1);"></div>
        </div>

        <button type="button" onclick="loginWithGoogle()" class="btn btn-ghost" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; border-color:rgba(255,255,255,0.15);">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.6 3.6 1.7 7.4l3.7 2.9C6.3 7.2 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.4 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.7 6.4C.6 8.6 0 11 0 12.5s.6 3.9 1.7 6.1l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.7-2.2-6.6-5.2L1.7 15.9C3.6 19.7 7.4 23 12 23z"/></svg>
          Registrarse con Google
        </button>

        <div class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="core.js"></script>
<script>
// Inicialización del cliente de Supabase en el navegador
const supabaseUrl = 'https://vptcxzbbrxilfaqoxxvt.supabase.co';
const supabaseAnonKey = 'AQUI_TU_SUPABASE_ANON_KEY'; // Reemplaza por tu llave anon pública de Supabase
const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

(async()=>{ await redirectIfAuthed(); })();

document.getElementById('regForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg = document.getElementById('regMsg');
  msg.className = 'form-msg';
  const first   = document.getElementById('regFirst').value.trim();
  const last    = document.getElementById('regLast').value.trim();
  const email   = document.getElementById('regEmail').value.trim().toLowerCase();
  const country = document.getElementById('regCountry').value;
  const pass    = document.getElementById('regPass').value;
  const pass2   = document.getElementById('regPass2').value;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!first || !last){ msg.textContent='Ingresa tu nombre y apellido.'; msg.className='form-msg err'; return; }
  if(!EMAIL_RE.test(email)){ msg.textContent='Ingresa un correo electrónico válido.'; msg.className='form-msg err'; return; }
  if(pass.length < 6){ msg.textContent='La contraseña debe tener al menos 6 caracteres.'; msg.className='form-msg err'; return; }
  if(pass !== pass2){ msg.textContent='Las contraseñas no coinciden.'; msg.className='form-msg err'; return; }

  showLoading('Creando cuenta...');
  const { ok, data } = await apiFetch('/api/auth/register', {
    method: 'POST',
    body: { first, last, email, country, password: pass }
  });
  hideLoading();
  if(!ok){
    msg.textContent = data.error || 'Error al crear la cuenta. Intenta de nuevo.';
    msg.className = 'form-msg err'; return;
  }
  msg.textContent = '¡Cuenta creada! Iniciando sesión...';
  msg.className = 'form-msg ok';
  setTimeout(()=>{ location.href = 'panel.html'; }, 700);
});

async function loginWithGoogle() {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/panel.html'
    }
  });
  if (error) {
    if (typeof showToast === 'function') {
      showToast('Error al conectar con Google');
    } else {
      alert('Error al conectar con Google');
    }
    console.error(error);
  }
}
</script>
</body>
</html>
